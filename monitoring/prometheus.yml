# Prometheus scrape config for Velo (singleton or cluster).
#
# Velo parses its HTTP query positionally. It now also accepts Prometheus's
# key=value params by keeping only the value part, so a single repeated key
# `arg` reproduces the positional command (Prometheus preserves value order
# within one key):
#
#   params: {arg: [metrics]}                       -> GET /?arg=metrics
#   params: {arg: [manage, slot, '0', view-metrics]} -> GET /?arg=manage&arg=slot&arg=0&arg=view-metrics
#
# No relay is needed: each Velo instance is scraped directly, so `__address__`
# is already the instance and `instance` is set automatically. Per-slot output
# already carries Velo's own `{slot="N"}` label. List each Velo instance under
# `targets:`; works unchanged for a singleton or a whole cluster.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # ---- Global registry: JVM, request_time, global_*, compress_stats, dict ----
  - job_name: velo-global
    metrics_path: /
    params:
      arg: [metrics]
    static_configs:
      - targets:
          - 127.0.0.1:7379        # <-- Velo instance(s); add more lines for a cluster
        labels:
          cluster: velo

  # ---- Per-slot metrics for slot 0 ----
  - job_name: velo-slot0
    metrics_path: /
    params:
      arg: [manage, slot, '0', view-metrics]
    static_configs:
      - targets:
          - 127.0.0.1:7379
        labels:
          cluster: velo

  # ---- Per-slot metrics for the last slot ----
  # Set the index to slotNumber-1 for your deployment (default slotNumber=1, so
  # the last slot is 0 and equals velo-slot0 — drop this job or bump the index
  # once you run more slots). The series is labelled by Velo's own {slot="N"}.
  - job_name: velo-slot-last
    metrics_path: /
    params:
      arg: [manage, slot, '0', view-metrics]   # <-- change '0' to slotNumber-1
    static_configs:
      - targets:
          - 127.0.0.1:7379
        labels:
          cluster: velo
